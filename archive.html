<!DOCTYPE html>
<html>
<head>
  <title>PGA Pick'em Challenge: Historical Data - Past Year Summary</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/w3.css">
  <link rel="stylesheet" href="css/w3-theme-black.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.3.0/css/font-awesome.min.css">
  <link rel="icon" href="img/golfball.jpg">
  
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f9f9f9;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            background-color: white;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #4CAF50;
            color: white;
            text-transform: uppercase;
        }
        tr:hover {
            background-color: #f5f5f5;
        }
        #loading {
            font-weight: bold;
            color: #666;
        }
    </style>
</head>
<body>

    <h2>📊 Live Google Sheets Data</h2>
    <div id="loading">Loading data from Google Sheets...</div>
    
    <table id="data-table" style="display: none;">
        <thead id="table-head"></thead>
        <tbody id="table-body"></tbody>
    </table>

    <script>
        // ⚠️ REPLACE THIS WITH YOUR OWN SPREADSHEET ID
        const SPREADSHEET_ID = '1BoF96ilpgiG20zPl0tvolq5ffiZ7S9xrqttla7WEECI';
        // Optional: specify sheet tab name (e.g., 'Sheet1')
        const SHEET_TITLE = 'yearlytotals'; 
        
        // This endpoint returns sheet data wrapped in a clean text format
        const URL = `https://google.com{SPREADSHEET_ID}/gviz/tq?tqx=out:json&sheet=${SHEET_TITLE}`;
//https://docs.google.com/spreadsheets/d/1BoF96ilpgiG20zPl0tvolq5ffiZ7S9xrqttla7WEECI/edit?usp=sharing
        async function fetchSheetData() {
            try {
                const response = await fetch(URL);
                const text = await response.text();
                
                // The API returns data wrapped in a callback function: google.visualization.Query.setResponse({...})
                // We extract the raw JSON object inside the parentheses
                const jsonString = text.substring(text.indexOf("{"), text.lastIndexOf("}") + 1);
                const data = JSON.parse(jsonString);
                
                displayTable(data.table);
            } catch (error) {
                console.error("Error fetching data:", error);
                document.getElementById('loading').innerText = "Failed to load data. Verify your Sheet ID and permissions.";
            }
        }

        function displayTable(tableData) {
            const headContainer = document.getElementById('table-head');
            const bodyContainer = document.getElementById('table-body');
            
            // 1. Generate Headers
            let headHtml = '<tr>';
            tableData.cols.forEach(col => {
                // If a column header is empty in Google Sheets, use an empty string
                const label = col.label ? col.label : '';
                headHtml += `<th>${label}</th>`;
            });
            headHtml += '</tr>';
            headContainer.innerHTML = headHtml;

            // 2. Generate Rows
            let bodyHtml = '';
            tableData.rows.forEach(row => {
                bodyHtml += '<tr>';
                row.c.forEach(cell => {
                    // Handle empty cells gracefully
                    const value = cell && cell.f ? cell.f : (cell && cell.v ? cell.v : '');
                    bodyHtml += `<td>${value}</td>`;
                });
                bodyHtml += '</tr>';
            });
            bodyContainer.innerHTML = bodyHtml;

            // Toggle Visibility
            document.getElementById('loading').style.display = 'none';
            document.getElementById('data-table').style.display = 'table';
        }

        // Initialize fetching on page load
        fetchSheetData();
    </script>
  <!-- Sidebar / Interface Interaction Logic Script -->
  <script>
    function w3_open() {
      var x = document.getElementById("mySidebar");
      x.style.width = "100%";
      x.style.fontSize = "40px";
      x.style.paddingTop = "10%";
      x.style.display = "block";
    }

    function w3_close() {
      document.getElementById("mySidebar").style.display = "none";
    }

    function openCity(evt, cityName) {
      var i;
      var x = document.getElementsByClassName("city");
      for (i = 0; i < x.length; i++) {
        x[i].style.display = "none";
      }
      var activebtn = document.getElementsByClassName("testbtn");
      for (i = 0; i < activebtn.length; i++) {
        activebtn[i].className = activebtn[i].className.replace(" w3-dark-grey", "");
      }
      var targetElement = document.getElementById(cityName);
      if (targetElement) targetElement.style.display = "block";
      if (evt && evt.currentTarget) evt.currentTarget.className += " w3-dark-grey";
    }

    // Safety implementation verifying node exists before forcing clicks
    var mybtn = document.getElementsByClassName("testbtn")[0];
    if (mybtn) {
      mybtn.click();
    }
  </script>

</body>
</html>
