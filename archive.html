<!DOCTYPE html>
<html>
<head>
  <title>PGA Pick'em Challenge: Historical Data - Past Year Summary</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/w3.css">
  <link rel="stylesheet" href="css/w3-theme-black.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.3.0/css/font-awesome.min.css">
  <link rel="icon" href="img/golfball.jpg">
  
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f9f9f9;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            background-color: white;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #4CAF50;
            color: white;
            text-transform: uppercase;
        }
        tr:hover {
            background-color: #f5f5f5;
        }
        #loading {
            font-weight: bold;
            color: #666;
        }
    </style>
</head>
<body>

    <h2>📊 Live Google Sheets Data</h2>
    <div id="loading">Loading data from Google Sheets...</div>
    
    <table id="data-table" style="display: none;">
        <thead id="table-head"></thead>
        <tbody id="table-body"></tbody>
    </table>

<script>
    // 1. Put your spreadsheet ID and tab name here
    const SPREADSHEET_ID = '1BoF96ilpgiG20zPl0tvolq5ffiZ7S9xrqttla7WEECI';
    const SHEET_TITLE = 'yearlytotals'; 
    
    // 2. Updated fail-safe URL layout targeting the public CSV streaming channel
    const URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/pub?output=csv&sheet=${SHEET_TITLE}`;

    async function fetchSheetData() {
        try {
            const response = await fetch(URL);
            if (!response.ok) throw new Error("Network request failed");
            const csvText = await response.text();
            
            parseAndDisplayCSV(csvText);
        } catch (error) {
            console.error("Error fetching data:", error);
            document.getElementById('loading').innerText = "Failed to load data. Ensure the sheet is 'Published to Web' as a CSV.";
        }
    }

    function parseAndDisplayCSV(csvData) {
        const headContainer = document.getElementById('table-head');
        const bodyContainer = document.getElementById('table-body');
        
        // Split text into individual row arrays
        const rows = csvData.split('\n').map(row => {
            // Simple regex splitter to handle data containing standard text strings cleanly
            return row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
        });

        // 1. Render Table Headers
        if (rows.length > 0) {
            let headHtml = '<tr>';
            rows[0].forEach(header => {
                headHtml += `<th>${header.replace(/"/g, '').trim()}</th>`;
            });
            headHtml += '</tr>';
            headContainer.innerHTML = headHtml;
        }

        // 2. Render Table Body Rows
        let bodyHtml = '';
        for (let i = 1; i < rows.length; i++) {
            if (rows[i].length === 1 && rows[i][0] === "") continue; // Skip blank trailing lines
            bodyHtml += '<tr>';
            rows[i].forEach(cell => {
                bodyHtml += `<td>${cell.replace(/"/g, '').trim()}</td>`;
            });
            bodyHtml += '</tr>';
        }
        bodyContainer.innerHTML = bodyHtml;

        // Toggle UI elements visible
        document.getElementById('loading').style.display = 'none';
        document.getElementById('data-table').style.display = 'table';
    }

    // Run automatically on boot
    fetchSheetData();
</script>

  <!-- Sidebar / Interface Interaction Logic Script -->
  <script>
    function w3_open() {
      var x = document.getElementById("mySidebar");
      x.style.width = "100%";
      x.style.fontSize = "40px";
      x.style.paddingTop = "10%";
      x.style.display = "block";
    }

    function w3_close() {
      document.getElementById("mySidebar").style.display = "none";
    }

    function openCity(evt, cityName) {
      var i;
      var x = document.getElementsByClassName("city");
      for (i = 0; i < x.length; i++) {
        x[i].style.display = "none";
      }
      var activebtn = document.getElementsByClassName("testbtn");
      for (i = 0; i < activebtn.length; i++) {
        activebtn[i].className = activebtn[i].className.replace(" w3-dark-grey", "");
      }
      var targetElement = document.getElementById(cityName);
      if (targetElement) targetElement.style.display = "block";
      if (evt && evt.currentTarget) evt.currentTarget.className += " w3-dark-grey";
    }

    // Safety implementation verifying node exists before forcing clicks
    var mybtn = document.getElementsByClassName("testbtn")[0];
    if (mybtn) {
      mybtn.click();
    }
  </script>

</body>
</html>
